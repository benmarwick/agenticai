  <title
     id="title1">Researcher-directed agentic AI workflow</title>
  <desc
     id="desc1">Two lanes, researcher and agent, across four stages: research, plan, execute, verify. The researcher sets constraints first, approves each step before it runs, and verifies outputs. Rejected results return to the plan. All changes are recorded in Git, the plan file and the Quarto report.</desc>
  <defs
     id="defs2">
    <marker
       id="ah"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse"
       preserveAspectRatio="xMidYMid">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#333"
         id="path1" />
    </marker>
    <marker
       id="ahb"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse"
       preserveAspectRatio="xMidYMid">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#005a8c"
         id="path2" />
    </marker>
    <marker
       id="ahb-6"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="0.001"
       markerHeight="0.001"
       orient="auto-start-reverse"
       preserveAspectRatio="xMidYMid">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#005a8c"
         id="path2-1" />
    </marker>
