     style="fill:#cfe4f5;stroke:#0072b2;stroke-width:2.5" />
  <g
     font-size="22"
     font-weight="bold"
     id="g16">
    <text
       x="94"
       y="233"
       id="text13">Frames the question</text>
    <text
       x="371"
       y="233"
       id="text14">Writes the plan</text>
    <text
       x="648"
       y="233"
       id="text15">Evaluates each step</text>
    <text
       x="925"
       y="233"
       id="text16">Inspects the work</text>
  </g>
  <g
     font-size="21"
     id="g24">
    <text
       x="94"
       y="264"
       id="text17">Defines goals, scope,</text>
    <text
       x="94"
       y="290"
       id="text18">conceptual framework</text>
    <text
       x="371"
       y="264"
       id="text19">Applies judgement,</text>
    <text
       x="371"
       y="290"
       id="text20">critique and expertise</text>
    <text
       x="648"
       y="264"
       id="text21">Steers agent to action,</text>
    <text
       x="648"
       y="290"
       id="text22">prompts from the plan</text>
    <text
       x="925"
       y="264"
       id="text23">Verifies code, outputs,</text>
    <text
       x="925"
       y="290"
       id="text24">assesses plausibility</text>
  </g>
  <!-- Agent boxes (dashed, rounded) -->
  <g
     fill="#FFFFFF"
