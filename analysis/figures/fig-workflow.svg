  </g>
  <g
     font-size="22"
     font-weight="bold"
     id="g30">
    <text
       x="96"
       y="423"
       id="text27">Searches literature</text>
    <text
       x="373"
       y="423"
       id="text28">Critiques the plan</text>
    <text
       x="650"
       y="423"
       id="text29">Executes the step</text>
    <text
       x="927"
       y="423"
       id="text30">Reports what it did</text>
  </g>
  <g
     font-size="21"
     id="g38">
    <text
       x="96"
       y="454"
       id="text31">Finds and validates</text>
    <text
       x="96"
       y="480"
       id="text32">references</text>
    <text
       x="373"
       y="454"
       id="text33">Updates plan.md</text>
    <text
       x="373"
       y="480"
       id="text34">Identify forking paths</text>
    <text
       x="650"
       y="454"
       id="text35">Build mode: writes code,</text>
    <text
       x="650"
       y="480"
       id="text36">runs code, and edits files</text>
    <text
       x="927"
       y="454"
       id="text37">Summary, diff and</text>
    <text
       x="927"
       y="480"
       id="text38">commit for review</text>
  </g>
  <!-- Decision gates -->
  <g
