  <!-- Constraints band -->
  <rect
     x="20"
     y="15"
     width="1160"
     height="80"
     rx="10"
     fill="#EEEEEE"
     stroke="#777"
     stroke-width="2"
     id="rect2" />
  <text
     x="40"
     y="47"
     font-size="24px"
     font-weight="bold"
     id="text2">Prior to starting work: Constraints set in AGENTS.md and harness permissions</text>
  <text
     x="40"
     y="79"
     font-size="21px"
     id="text3">Protect restricted data (local vs remote models) · indicate style preferences · define what the agent may read, run and edit</text>
  <!-- Stage headers -->
  <g
     font-size="26"
     font-weight="bold"
     text-anchor="middle"
     id="g7">
    <text
       x="210"
       y="132"
       id="text4">1 Research</text>
    <text
       x="487"
       y="132"
       id="text5">2 Plan</text>
    <text
       x="764"
       y="132"
       id="text6">3 Execute</text>
    <text
       x="1041"
       y="132"
       id="text7">4 Verify</text>
  </g>
  <!-- Rejection loop -->
  <path
     d="M 1041,185 V 160 H 487 v 23"
