name: Render Manuscript

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agenticai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Render Quarto Documents
        run: |
          docker run --name render-container \
            -e R_LIBS_USER=/opt/renv/library \
            -e RENV_CONFIG_AUTOLOADER_ENABLED=FALSE \
            agenticai:latest \
            bash -lc "quarto render analysis/paper/paper.qmd --to docx"

      - name: Download .docx from Container
        run: |
          docker cp render-container:/project/analysis/paper/paper.docx ./paper.docx

      - name: Upload to Summary Page
        uses: actions/upload-artifact@v4
        with:
          name: Manuscript-Word-Doc
          path: paper.docx
          retention-days: 7
