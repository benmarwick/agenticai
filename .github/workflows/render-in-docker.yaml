name: Render Manuscript

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free ~14 GB of runner disk space occupied by tools this build doesn't need.
      # rocker/verse + renv packages can easily exceed 8 GB; without this step the
      # Docker export hits "no space left on device" before it can finish.
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true        # removes pre-installed language runtimes (~8 GB)
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false     # keep swap — R/renv needs it if memory spikes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agenticai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Render Quarto Documents
        run: |
          docker run --name render-container agenticai:latest \
            bash -lc "quarto render analysis/paper/paper.qmd --to docx"

      - name: Download .docx from Container
        run: |
          docker cp render-container:/project/analysis/paper/paper.docx ./paper.docx

      - name: Upload to Summary Page
        uses: actions/upload-artifact@v4
        with:
          name: Manuscript-Word-Doc
          path: paper.docx
          retention-days: 7
